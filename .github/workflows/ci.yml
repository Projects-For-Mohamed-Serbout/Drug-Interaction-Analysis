name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  drug-data-engine:
    name: Drug Data Engine (Python)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ./drug-data-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install linters (Flake8)
        working-directory: ./drug-data-engine
        run: pip install flake8

      - name: Run Flake8
        working-directory: ./drug-data-engine
        run: flake8 .

  drug-data-ui:
    name: Drug Data UI (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./drug-data-ui
        run: npm ci

      - name: Run ESLint
        working-directory: ./drug-data-ui
        run: npm run lint

      - name: Build Vite App
        working-directory: ./drug-data-ui
        run: npm run build
